[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deephedging-rewritten"
version = "1.0.0"
description = "Self-contained rewritten Deep Hedging 7-notebook benchmark with JAX and TensorFlow engines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "tensorflow>=2.11.0",
    "tensorflow-probability>=0.19.0",
    "cdxbasics>=0.2.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "ipykernel>=6.0.0",
    "notebook>=6.5.0",
    "psutil>=5.9.0"
]
